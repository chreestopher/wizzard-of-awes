AWSTemplateFormatVersion: '2010-09-09'
Description: GitHub Actions static-site deployment access for Wizzard of Awes

Parameters:
  GitHubOidcSubject:
    Type: String
    Description: Exact immutable GitHub OIDC subject for the repository main branch
  SiteBucketName:
    Type: String
  DistributionId:
    Type: String

Resources:
  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: wizzard-of-awes-github-deploy
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Ref GitHubOidcSubject
      Policies:
        - PolicyName: PublishWizzardSite
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [s3:ListBucket]
                Resource: !Sub arn:${AWS::Partition}:s3:::${SiteBucketName}
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:DeleteObject]
                Resource: !Sub arn:${AWS::Partition}:s3:::${SiteBucketName}/*
              - Effect: Allow
                Action: [cloudfront:CreateInvalidation, cloudfront:GetInvalidation]
                Resource: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${DistributionId}

Outputs:
  DeployRoleArn:
    Value: !GetAtt DeployRole.Arn
