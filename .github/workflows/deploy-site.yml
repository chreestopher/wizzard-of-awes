name: Deploy Wizzard of Awes

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

# Finish an upload/invalidation before starting another release.
concurrency:
  group: wizzard-of-awes-production
  cancel-in-progress: false

jobs:
  merged-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      deploy: ${{ steps.check.outputs.deploy }}
    steps:
      - name: Require the latest main commit to come from a merged PR
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          latest=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [[ "$latest" != "$GITHUB_SHA" ]]; then
            echo "Skipping a superseded main commit." >> "$GITHUB_STEP_SUMMARY"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          matches=$(gh api --paginate "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
            | jq -s --arg sha "$GITHUB_SHA" '[.[][] | select(.merged_at != null and .base.ref == "main" and .merge_commit_sha == $sha)] | length')
          if [[ "$matches" -eq 0 ]]; then
            echo "Skipping a direct push: deployment requires a merged PR into main." >> "$GITHUB_STEP_SUMMARY"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "deploy=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: merged-pr
    if: needs.merged-pr.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: us-east-1
      SITE_BUCKET: ${{ vars.SITE_BUCKET }}
      DISTRIBUTION_ID: ${{ vars.DISTRIBUTION_ID }}
      STACK_NAME: ${{ vars.STACK_NAME }}
      ARTIFACT_BUCKET: ${{ vars.ARTIFACT_BUCKET }}
      CLOUDFORMATION_ROLE_ARN: ${{ vars.CLOUDFORMATION_ROLE_ARN }}
      SITE_URL: https://wizzardofawes.com
    steps:
      - name: Check out the merged commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check application syntax
        run: node --check site/app.js
      - name: Install backend test dependencies
        run: python3 -m pip install -r tests/requirements.txt
      - name: Check backend security and deployment failure handling
        run: python3 -m unittest discover -s tests
      - name: Validate infrastructure templates
        run: cfn-lint infra/template.yaml infra/github-deploy-role.yaml
      - name: Authenticate to AWS using GitHub OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: wizzard-deploy-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
      - name: Deploy backend, infrastructure, and website
        run: python3 scripts/deploy-app.py
